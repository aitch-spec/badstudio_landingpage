 *
 * Glyphs live in a normalized box: x 0..1 left-to-right, y 0..1 cap-top to

 *

 * the far side of a seam absorb the full stretch, points on the near side
 * absorb none, and a point sitting exactly on it absorbs half. Letters

 * Short flat runs straddling a seam are what turn that into a clean extension
 * rather than a smeared curve.

  // in both directions. Most curved glyphs are assembled from these.
  function box(x0, y0, x1, y1) {
    var w = x1 - x0, h = y1 - y0;
    var ax = x0 + F * w, bx = x1 - F * w;
    var ay = y0 + F * h, by = y1 - F * h;
    var cx = (1 - K) * F * w, cy = (1 - K) * F * h;

      tl: [x0, ay], t0: [ax, y0], t1: [bx, y0], tr: [x1, ay],
      br: [x1, by], b1: [bx, y1], b0: [ax, y1], bl: [x0, by],
      aTL: ['c', [x0, y0 + cy], [x0 + cx, y0], [ax, y0]],
      aTR: ['c', [x1 - cx, y0], [x1, y0 + cy], [x1, ay]],
      aBR: ['c', [x1, y1 - cy], [x1 - cx, y1], [bx, y1]],
      aBL: ['c', [x0 + cx, y1], [x0, y1 - cy], [x0, by]],

      rTR: ['c', [x1, y0 + cy], [x1 - cx, y0], [bx, y0]],
      rBR: ['c', [x1 - cx, y1], [x1, y1 - cy], [x1, by]],
      rBL: ['c', [x0, y1 - cy], [x0 + cx, y1], [ax, y1]]
