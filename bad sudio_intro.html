<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colombo Remix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#111}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;max-width:100vw;max-height:100vh}
</style>
<canvas id="c"></canvas>
<script>
/* Baked 2026-08-05 from the Umi's House Colombo
   Remix Generator. This file has no controls on purpose — go back to the
   prototype, adjust, and bake again whenever something needs to change. */
const CONFIG = {
  "words": "BUILD ALL DREAMS . BAD STUDIO ",
  "spawnIntervalMs": 1000,
  "textColor": "#fffef7",
  "textOpacity": 100,
  "shapeType": "capsules",
  "baseRadius": 34,
  "shapeColor": "#4168b1",
  "shapeOpacity": 100,
  "bounciness": 1,
  "pulseEnabled": true,
  "pulseRate": 100,
  "showTextInCircles": false,
  "showTextInCapsules": true,
  "ropesEnabled": true,
  "connectionMode": "chain",
  "ropeSmoothness": 7,
  "ropeElasticity": 0.249,
  "ropeDamping": 0.82,
  "segmentLength": 54,
  "ropeColor": "#fffef7",
  "ropeOpacity": 100,
  "ropeWidth": 10,
  "ropeDash": 0,
  "showBoundary": true,
  "frameContainment": true,
  "membraneColor": "#ff3f00",
  "membraneOpacity": 100,
  "centerAttraction": 0,
  "gravityEnabled": true,
  "gravityStrength": 0,
  "bgMode": "solid",
  "bg": "#fffef7",
  "bgOpacity": 100,
  "width": 1200,
  "height": 800
};
const ColomboEngine = function ColomboEngine(canvas, CONFIG, opts){
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const BASE_GRAVITY = 0.4;
  const MAX_LINKS = 260;

  const BAG_BUCKETS = 32;           // angular resolution of the membrane profile
  const BAG_PADDING_RATIO = 0.4;    // * baseRadius: gap kept between capsule edge and bag wall
  const BAG_MIN_RADIUS_RATIO = 2.4; // * baseRadius: floor so the bag never collapses to 0
  const BAG_GROW = 0.35;            // per-frame lerp toward a larger target (fast: pressure pushes bag out)
  const BAG_SHRINK = 0.03;          // per-frame lerp toward a smaller target (slow: rubber relaxes)
  const BAG_CENTROID_LERP = 0.05;   // smoothing on the moving center, avoids 1-frame jitter/spawn pops
  const BAG_SMOOTH_SELF = 0.6, BAG_SMOOTH_NEIGHBOR = 0.2; // 3-tap circular blur across buckets
  const BAG_WOBBLE_RATIO = 0.015;   // residual cosmetic wobble on top of the data-driven shape
  const BAG_WALL_MARGIN_RATIO = 0.15; // * baseRadius: extra margin so containment stays inside the smoothed outline

  const ROPE_WAVE_AMP_RATIO = 0.18;  // wave amplitude as a fraction of the segment's live length
  const ROPE_WAVE_AMP_MIN = 2;
  const ROPE_WAVE_WIDTH_MULT = 1.6, ROPE_WAVE_WIDTH_ADD = 6; // amplitude cap relative to ropeWidth
  const ROPE_WAVE_SPEED = 1.4;          // multiplier on swayPhase for rope-specific tempo
  const ROPE_WAVE_PHASE_STEP = 0.9;     // radians of phase offset per constraint index (de-syncs neighbors)
  const ROPE_WAVE_CP2_PHASE = 2.04;     // second control point's phase offset (creates the S-bend)

  let W = 0, H = 0, chain = [], constraints = [], pendingWords = [];
  let bag = { cx: 0, cy: 0, radii: null, N: BAG_BUCKETS };
  let spawnTimer = 0, swayPhase = 0, lastT = null, raf = null;

  function hexToRgba(hex, a){
    hex = (hex || '#000000').replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const r = parseInt(hex.slice(0, 2), 16) || 0, g = parseInt(hex.slice(2, 4), 16) || 0, b = parseInt(hex.slice(4, 6), 16) || 0;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function applySize(cssW, cssH){
    const DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(cssW * DPR);
    canvas.height = Math.round(cssH * DPR);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    W = cssW; H = cssH;
  }

  function fontStr(size){ return "700 " + Math.round(size) + "px -apple-system, 'Helvetica Neue', Arial, sans-serif"; }

  function measureWord(word){
    ctx.font = fontStr(CONFIG.baseRadius * 0.62);
    return ctx.measureText(word).width;
  }

  function makeShape(word, idx, after){
    const isCapsule = CONFIG.shapeType === 'capsules' ? true
      : CONFIG.shapeType === 'circles' ? false
      : (idx % 2 === 0);
    const r = CONFIG.baseRadius;
    const textW = measureWord(word);
    const halfW = isCapsule ? Math.max(r * 0.85, textW / 2 + r * 0.5) : Math.max(r, textW / 2 + r * 0.25);
    const cx = W / 2, cy = H / 2;
    const spawnX = after ? after.x + (Math.random() - 0.5) * 10 : cx;
    const spawnY = after ? after.y - r * 2 - 6 : cy - r * 2;
    const s = { word: word, idx: idx, isCapsule: isCapsule, x: spawnX, y: spawnY, r: r, halfW: halfW, angle: 0 };
    s.px = s.x - (Math.random() - 0.5); s.py = s.y - 1;
    return s;
  }

  function reset(){
    chain = []; constraints = []; spawnTimer = 0;
    bag = { cx: W / 2, cy: H / 2, radii: null, N: BAG_BUCKETS };
    pendingWords = (CONFIG.words || '').trim().split(/\s+/).filter(Boolean);
  }

  function segLen(){ return Math.max(2, CONFIG.segmentLength || 40); }

  function spawnNext(){
    if (chain.length >= MAX_LINKS) return;
    if (!pendingWords.length){
      const wordList = (CONFIG.words || '').trim().split(/\s+/).filter(Boolean);
      if (!wordList.length) return;
      pendingWords = wordList.slice();
    }
    const word = pendingWords.shift();
    const prev = chain[chain.length - 1] || null;
    const s = makeShape(word, chain.length, prev);
    chain.push(s);
    if (prev && CONFIG.ropesEnabled){
      if (CONFIG.connectionMode === 'pairs'){
        if (chain.length % 2 === 0) constraints.push({ a: prev, b: s, len: segLen() });
      } else {
        constraints.push({ a: prev, b: s, len: segLen() });
      }
    }
  }

  function rebuild(){ reset(); spawnNext(); }

  function rebuildConstraints(){
    constraints = [];
    if (!CONFIG.ropesEnabled) return;
    if (CONFIG.connectionMode === 'pairs'){
      for (let i = 1; i < chain.length; i += 2) constraints.push({ a: chain[i - 1], b: chain[i], len: segLen() });
    } else {
      for (let i = 1; i < chain.length; i++) constraints.push({ a: chain[i - 1], b: chain[i], len: segLen() });
    }
  }

  function computeCentroid(){
    if (!chain.length) return { x: W / 2, y: H / 2 };
    let sx = 0, sy = 0;
    chain.forEach(s => { sx += s.x; sy += s.y; });
    return { x: sx / chain.length, y: sy / chain.length };
  }

  /* The "elastic bag": a radial radius profile sampled at BAG_BUCKETS angles
     around a slowly-drifting center. Each bucket grows fast toward whatever
     capsule is pressing hardest against it this frame, and shrinks slowly
     otherwise — the same shape doubles as the containment boundary (below)
     and the drawn membrane (drawMembrane), so capsules can never render
     outside what's on screen. */
  function updateBag(){
    const N = bag.N;
    const target = computeCentroid();
    bag.cx += (target.x - bag.cx) * BAG_CENTROID_LERP;
    bag.cy += (target.y - bag.cy) * BAG_CENTROID_LERP;
    /* Nothing else anchors the cluster to the canvas when gravity and center
       attraction are both off (the default) — without this, the pulse sway's
       tiny per-frame bias compounds over a long-running export and the whole
       piece can wander off-screen. Keep the bag's own center on-canvas; its
       radii still track the real cluster shape untouched. */
    const marginX = W * 0.12, marginY = H * 0.12;
    bag.cx = Math.max(marginX, Math.min(W - marginX, bag.cx));
    bag.cy = Math.max(marginY, Math.min(H - marginY, bag.cy));

    const minR = CONFIG.baseRadius * BAG_MIN_RADIUS_RATIO;
    if (!bag.radii) bag.radii = new Array(N).fill(minR);

    const padding = CONFIG.baseRadius * BAG_PADDING_RATIO;
    const desired = new Array(N).fill(0);
    const touched = new Array(N).fill(false);

    for (let i = 0; i < chain.length; i++){
      const s = chain[i];
      const dx = s.x - bag.cx, dy = s.y - bag.cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const extentR = Math.max(s.r, s.halfW);
      const want = dist + extentR + padding;
      let ang = Math.atan2(dy, dx); if (ang < 0) ang += Math.PI * 2;
      const idx = Math.min(N - 1, Math.floor(ang / (Math.PI * 2) * N));
      if (want > desired[idx]) desired[idx] = want;
      touched[idx] = true;
    }

    const grown = new Array(N);
    for (let i = 0; i < N; i++){
      const cur = bag.radii[i];
      const want = touched[i] ? Math.max(desired[i], minR) : Math.max(minR, cur);
      const rate = want > cur ? BAG_GROW : BAG_SHRINK;
      grown[i] = cur + (want - cur) * rate;
    }

    const smoothed = new Array(N);
    for (let i = 0; i < N; i++){
      const prev = grown[(i - 1 + N) % N], next = grown[(i + 1) % N];
      smoothed[i] = grown[i] * BAG_SMOOTH_SELF + prev * BAG_SMOOTH_NEIGHBOR + next * BAG_SMOOTH_NEIGHBOR;
    }
    bag.radii = smoothed;
  }

  function bagRadiusAtAngle(ang){
    const N = bag.N;
    if (!bag.radii) return CONFIG.baseRadius * BAG_MIN_RADIUS_RATIO;
    let a = ang; if (a < 0) a += Math.PI * 2;
    const f = (a / (Math.PI * 2)) * N;
    const i0 = Math.floor(f) % N, i1 = (i0 + 1) % N;
    const t = f - Math.floor(f);
    return bag.radii[i0] * (1 - t) + bag.radii[i1] * t;
  }

  function stepPhysics(){
    const damp = 0.99;
    const cx = bag.cx, cy = bag.cy;
    const gravity = CONFIG.gravityEnabled ? BASE_GRAVITY * (CONFIG.gravityStrength || 0) : 0;
    const attract = (CONFIG.centerAttraction || 0) * 0.02;
    chain.forEach(s => {
      const vx = (s.x - s.px) * damp, vy = (s.y - s.py) * damp;
      s.px = s.x; s.py = s.y;
      s.x += vx + (attract ? (cx - s.x) * attract : 0);
      s.y += vy + gravity + (attract ? (cy - s.y) * attract : 0);
    });

    const iterations = Math.min(14, Math.max(1, Math.round(CONFIG.ropeSmoothness || 1)));
    const elastic = Math.max(0.02, Math.min(1, CONFIG.ropeElasticity || 0.25));
    for (let it = 0; it < iterations; it++){
      constraints.forEach(c => {
        const dx = c.b.x - c.a.x, dy = c.b.y - c.a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
        const diff = (dist - c.len) / dist * 0.5 * elastic;
        c.a.x += dx * diff; c.a.y += dy * diff;
        c.b.x -= dx * diff; c.b.y -= dy * diff;
      });
    }

    const ropeDamp = Math.max(0, Math.min(0.98, CONFIG.ropeDamping || 0));
    if (ropeDamp > 0){
      constraints.forEach(c => {
        const relVX = (c.a.x - c.a.px) - (c.b.x - c.b.px);
        const relVY = (c.a.y - c.a.py) - (c.b.y - c.b.py);
        c.a.px += relVX * ropeDamp * 0.5; c.a.py += relVY * ropeDamp * 0.5;
        c.b.px -= relVX * ropeDamp * 0.5; c.b.py -= relVY * ropeDamp * 0.5;
      });
    }

    for (let i = 0; i < chain.length; i++){
      for (let j = i + 1; j < chain.length; j++){
        const a = chain[i], b = chain[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = a.r + b.r;
        if (dist > 0 && dist < minDist){
          const overlap = (minDist - dist) / 2;
          const nx = dx / dist, ny = dy / dist;
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
        }
      }
    }

    updateBag();
    if (CONFIG.frameContainment){
      const wallMargin = CONFIG.baseRadius * BAG_WALL_MARGIN_RATIO;
      chain.forEach(s => {
        const dx = s.x - bag.cx, dy = s.y - bag.cy;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
        const ang = Math.atan2(dy, dx);
        const R = bagRadiusAtAngle(ang);
        const extentR = Math.max(s.r, s.halfW);
        const maxDist = Math.max(4, R - extentR - wallMargin);
        if (dist > maxDist){
          const nx = dx / dist, ny = dy / dist;
          const vx = s.x - s.px, vy = s.y - s.py;
          s.x = bag.cx + nx * maxDist; s.y = bag.cy + ny * maxDist;
          s.px = s.x - vx * CONFIG.bounciness; s.py = s.y - vy * CONFIG.bounciness;
        }
      });
    }

    chain.forEach(s => {
      if (s.x - s.halfW < 0){ s.x = s.halfW; const vx = s.x - s.px; s.px = s.x + vx * CONFIG.bounciness; }
      if (s.x + s.halfW > W){ s.x = W - s.halfW; const vx = s.x - s.px; s.px = s.x + vx * CONFIG.bounciness; }
      if (s.y - s.r < -H){ s.y = -H; }
      if (s.y + s.r > H * 2){ s.y = H * 2; }
    });
  }

  function maybePulse(dtMs){
    if (!CONFIG.pulseEnabled || !chain.length) return;
    swayPhase += dtMs * 0.0011 * (0.4 + (CONFIG.pulseRate || 0) * 0.014);
    chain.forEach((s, i) => {
      s.x += Math.sin(swayPhase - i * 0.55) * 0.35;
      s.y += Math.cos(swayPhase * 0.8 - i * 0.4) * 0.25;
    });
  }

  function updateAngles(){
    for (let i = 0; i < chain.length; i++){
      const s = chain[i], prev = chain[i - 1], next = chain[i + 1];
      let dx = 0, dy = 1;
      if (prev && next){ dx = next.x - prev.x; dy = next.y - prev.y; }
      else if (next){ dx = next.x - s.x; dy = next.y - s.y; }
      else if (prev){ dx = s.x - prev.x; dy = s.y - prev.y; }
      s.angle = Math.atan2(dy, dx);
    }
  }

  function drawCapsule(hw, hh){
    const r = Math.min(hw, hh);
    ctx.beginPath();
    ctx.moveTo(-hw + r, -hh);
    ctx.lineTo(hw - r, -hh);
    ctx.arc(hw - r, 0, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(-hw + r, hh);
    ctx.arc(-hw + r, 0, r, Math.PI / 2, -Math.PI / 2);
    ctx.closePath();
    ctx.fill();
  }

  function drawBackground(){
    if (CONFIG.bgMode === 'none') return;
    ctx.fillStyle = hexToRgba(CONFIG.bg, (CONFIG.bgOpacity == null ? 100 : CONFIG.bgOpacity) / 100);
    ctx.fillRect(0, 0, W, H);
  }

  function drawMembrane(){
    if (!bag.radii) return;
    const N = bag.N;
    const pts = [];
    for (let i = 0; i < N; i++){
      const a = (i / N) * Math.PI * 2;
      const base = bag.radii[i];
      const wob = Math.sin(a * 3 + swayPhase * 0.3) * base * BAG_WOBBLE_RATIO;
      const rr = base + wob;
      pts.push({ x: bag.cx + Math.cos(a) * rr, y: bag.cy + Math.sin(a) * rr });
    }
    ctx.fillStyle = hexToRgba(CONFIG.membraneColor, (CONFIG.membraneOpacity || 0) / 100);
    ctx.beginPath();
    ctx.moveTo((pts[0].x + pts[N - 1].x) / 2, (pts[0].y + pts[N - 1].y) / 2);
    for (let i = 0; i < N; i++){
      const p = pts[i], next = pts[(i + 1) % N];
      const midx = (p.x + next.x) / 2, midy = (p.y + next.y) / 2;
      ctx.quadraticCurveTo(p.x, p.y, midx, midy);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawRopes(){
    if (!CONFIG.ropesEnabled || !CONFIG.ropeWidth) return;
    ctx.strokeStyle = hexToRgba(CONFIG.ropeColor, (CONFIG.ropeOpacity || 0) / 100);
    ctx.lineWidth = Math.max(1, CONFIG.ropeWidth || 1);
    ctx.lineCap = 'round';
    ctx.setLineDash(CONFIG.ropeDash > 0 ? [CONFIG.ropeDash, CONFIG.ropeDash] : []);
    const ampCap = CONFIG.ropeWidth * ROPE_WAVE_WIDTH_MULT + ROPE_WAVE_WIDTH_ADD;
    constraints.forEach((c, i) => {
      const dx = c.b.x - c.a.x, dy = c.b.y - c.a.y;
      const segDist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      const px = -dy / segDist, py = dx / segDist;
      const amp = Math.min(ampCap, Math.max(ROPE_WAVE_AMP_MIN, segDist * ROPE_WAVE_AMP_RATIO));
      const phase = swayPhase * ROPE_WAVE_SPEED + i * ROPE_WAVE_PHASE_STEP;
      const w1 = Math.sin(phase) * amp;
      const w2 = Math.sin(phase + ROPE_WAVE_CP2_PHASE) * -amp;
      const cp1x = c.a.x + dx / 3 + px * w1, cp1y = c.a.y + dy / 3 + py * w1;
      const cp2x = c.a.x + dx * 2 / 3 + px * w2, cp2y = c.a.y + dy * 2 / 3 + py * w2;
      ctx.beginPath();
      ctx.moveTo(c.a.x, c.a.y);
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, c.b.x, c.b.y);
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }

  function render(){
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    updateAngles();
    if (CONFIG.showBoundary) drawMembrane();
    drawRopes();
    const shapeFill = hexToRgba(CONFIG.shapeColor, (CONFIG.shapeOpacity || 0) / 100);
    const textFill = hexToRgba(CONFIG.textColor, (CONFIG.textOpacity || 0) / 100);
    chain.forEach(s => {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.angle);
      ctx.fillStyle = shapeFill;
      if (s.isCapsule) drawCapsule(s.halfW, s.r);
      else { ctx.beginPath(); ctx.arc(0, 0, s.r, 0, Math.PI * 2); ctx.fill(); }
      const showText = s.isCapsule ? CONFIG.showTextInCapsules : CONFIG.showTextInCircles;
      if (showText){
        ctx.fillStyle = textFill;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = fontStr(s.r * 0.62);
        ctx.fillText(s.word.toUpperCase(), 0, 1);
      }
      ctx.restore();
    });
  }

  function frame(ts){
    if (lastT === null) lastT = ts;
    const dt = ts - lastT; lastT = ts;
    spawnTimer += dt;
    const spawnMs = Math.max(20, CONFIG.spawnIntervalMs || 600);
    while (spawnTimer >= spawnMs && chain.length < MAX_LINKS){
      spawnTimer -= spawnMs;
      spawnNext();
    }
    stepPhysics();
    maybePulse(dt);
    render();
    raf = requestAnimationFrame(frame);
  }

  function start(){ if (raf === null){ lastT = null; raf = requestAnimationFrame(frame); } }
  function stop(){ if (raf !== null){ cancelAnimationFrame(raf); raf = null; } }
  function resize(cssW, cssH){ applySize(cssW, cssH); rebuild(); }

  applySize(CONFIG.width, CONFIG.height);
  rebuild();
  if (opts.autoStart !== false) start();

  return { rebuild: rebuild, rebuildConstraints: rebuildConstraints, resize: resize, start: start, stop: stop };
};
const c = document.getElementById('c');
   const engine = ColomboEngine(c, CONFIG, { autoStart: true });
   function fit(){
        engine.resize(window.innerWidth, window.innerHeight);
   }
   window.addEventListener('resize', fit);
   fit();
</script>
